!
! Aruba 6300 VLANs, DHCP & SSH lab
! Aruba 6300 (AOS-CX) switch configuration
!
! Transcribed from the configuration screenshot
! (screenshots/16-switch-configuration.png). Lines starting with "!" are
! comments; paste the rest into the switch CLI in configuration mode.
!

! ---------------------------------------------------------------
! DHCP pools (one per VLAN)
! ---------------------------------------------------------------
dhcp-server vrf default
    pool vlan7
        range 172.16.7.1 172.16.7.62
        default-router 172.16.7.1
        exit
    pool vlan70
        range 172.16.70.1 172.16.70.63
        default-router 172.16.70.1
        exit
    enable

! ---------------------------------------------------------------
! VLAN creation and gateway interfaces (SVIs)
! ---------------------------------------------------------------
vlan 7
 exit
vlan 70
 exit
interface vlan 7
    ip address 172.16.7.1/26
    no shutdown
interface vlan 70
    ip address 172.16.70.1/26
    no shutdown

! ---------------------------------------------------------------
! Access ports
! ---------------------------------------------------------------
interface 1/1/1
    no shutdown
    no routing
    vlan access 7
    exit
interface 1/1/2
    no shutdown
    no routing
    vlan access 70
    exit
